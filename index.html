<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>治愈系 3D 圣诞树 🎄</title>
<style>
  /* ========== 全局样式：深色背景衬托星光 ========== */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1026; }
  #scene { display: block; cursor: grab; touch-action: none; }
  #scene:active { cursor: grabbing; }

  /* 顶部标题与底部操作提示（浅色柔和文字） */
  .title, .hint {
    position: fixed; left: 50%; transform: translateX(-50%);
    color: rgba(235, 240, 255, .82);
    pointer-events: none; user-select: none;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  .title {
    top: 30px; font-size: 22px; letter-spacing: .35em; text-indent: .35em;
    text-shadow: 0 0 18px rgba(255, 225, 160, .55);
  }
  .hint {
    bottom: 26px; font-size: 13px; letter-spacing: .12em;
    padding: 8px 20px; border-radius: 999px;
    background: rgba(22, 28, 58, .38);
    border: 1px solid rgba(255, 255, 255, .09);
    backdrop-filter: blur(6px);
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="title">✦ Merry Christmas ✦</div>
<div class="hint">🎄 拖拽旋转 · 滚轮缩放 · 双击复位</div>

<script>
"use strict";

/* =====================================================================
 * 0. 画布初始化与自适应
 * =================================================================== */
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let W = 0, H = 0; // CSS 像素尺寸

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2); // 高分屏适配
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // 之后全部用 CSS 像素坐标绘制
}
window.addEventListener('resize', resize);
resize();

/* =====================================================================
 * 1. 相机状态与交互（拖拽旋转 / 滚轮缩放 / 双击复位）
 * =================================================================== */
let rotY = 0.55;      // 绕竖直轴的旋转角（水平拖拽）
let rotX = 0.22;      // 俯仰角（垂直拖拽，限制范围防止翻转）
let zoom = 1;         // 缩放系数（滚轮控制）
let dragging = false; // 是否正在拖拽
let lastX = 0, lastY = 0;
let velY = 0;         // 松手后的水平惯性速度
const FOV = 640;      // 透视焦距，越大透视越弱

canvas.addEventListener('pointerdown', e => {
  dragging = true;
  lastX = e.clientX; lastY = e.clientY;
  velY = 0;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  rotY += dx * 0.006;
  rotX = Math.min(1.05, Math.max(-0.05, rotX + dy * 0.004)); // 限制俯仰范围
  velY = dx * 0.0006; // 记录惯性
});
window.addEventListener('pointerup', () => { dragging = false; });
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  zoom = Math.min(2.6, Math.max(0.45, zoom * Math.exp(-e.deltaY * 0.0011)));
}, { passive: false });
canvas.addEventListener('dblclick', () => { // 双击恢复默认视角
  rotY = 0.55; rotX = 0.22; zoom = 1; velY = 0;
});

/* =====================================================================
 * 2. 简易 3D 投影：世界坐标 -> 屏幕坐标
 *    世界坐标系：y 轴向上，树底中心为原点
 * =================================================================== */
function project(x, y, z) {
  // 绕 Y 轴旋转（水平方向）
  const cy = Math.cos(rotY), sy = Math.sin(rotY);
  const x1 = x * cy - z * sy;
  const z1 = x * sy + z * cy;
  // 绕 X 轴旋转（俯仰方向）
  const cx = Math.cos(rotX), sx = Math.sin(rotX);
  const y2 = y * cx - z1 * sx;
  const z2 = y * sx + z1 * cx;
  // 透视投影：z 越大越远，s 为屏幕缩放系数
  const f = FOV / (FOV + z2);
  return {
    x: W / 2 + x1 * f * zoom,
    y: H * 0.64 - y2 * f * zoom,
    s: f * zoom,  // 绘制尺寸用的缩放
    z: z2         // 深度，用于遮挡排序
  };
}

/* =====================================================================
 * 3. 工具函数
 * =================================================================== */
const rand = (a, b) => a + Math.random() * (b - a);

/* 预渲染「光晕贴图」：白色核心 + 彩色渐变光晕，避免每帧使用昂贵的 shadowBlur */
function makeGlow(r, g, b) {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const g2 = c.getContext('2d');
  const grd = g2.createRadialGradient(32, 32, 0, 32, 32, 32);
  grd.addColorStop(0, 'rgba(255,255,255,1)');
  grd.addColorStop(0.22, `rgba(${r},${g},${b},0.95)`);
  grd.addColorStop(0.5, `rgba(${r},${g},${b},0.32)`);
  grd.addColorStop(1, `rgba(${r},${g},${b},0)`);
  g2.fillStyle = grd;
  g2.fillRect(0, 0, 64, 64);
  return c;
}

/* 灯光配色：暖金 / 粉 / 冰蓝 / 薄荷 / 奶白 —— 清新治愈浅色系 */
const LIGHT_COLORS = [
  [255, 209, 120], [255, 158, 200], [146, 200, 255], [159, 255, 214], [255, 244, 214]
];
const lightSprites = LIGHT_COLORS.map(c => makeGlow(c[0], c[1], c[2]));

/* 按概率挑选灯光颜色（暖金色最多，营造温暖感） */
function pickLightSprite() {
  const r = Math.random();
  if (r < 0.45) return lightSprites[0];
  if (r < 0.65) return lightSprites[1];
  if (r < 0.85) return lightSprites[2];
  if (r < 0.95) return lightSprites[3];
  return lightSprites[4];
}

/* 圆角矩形路径（兼容旧浏览器，不依赖原生 roundRect） */
function roundRect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

/* 五角星路径 */
function starPath(g, x, y, r) {
  g.beginPath();
  for (let i = 0; i < 10; i++) {
    const rr = i % 2 === 0 ? r : r * 0.45;
    const a = -Math.PI / 2 + i * Math.PI / 5;
    if (i === 0) g.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    else g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  g.closePath();
}

/* 「毛绒球」画法：主椭圆 + 边缘一圈小圆，营造蓬松感 */
function fluff(g, cx, cy, rx, ry, color, bumps) {
  g.fillStyle = color;
  g.beginPath();
  g.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
  g.fill();
  const n = bumps || 10;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    const bx = cx + Math.cos(a) * rx * 0.92;
    const by = cy + Math.sin(a) * ry * 0.92;
    g.beginPath();
    g.arc(bx, by, Math.min(rx, ry) * (0.26 + 0.1 * Math.sin(i * 2.7)), 0, Math.PI * 2);
    g.fill();
  }
}

/* =====================================================================
 * 4. 构建圣诞树数据（圆锥形点云 + 螺旋灯带 + 装饰球）
 * =================================================================== */
const TREE_H = 330;     // 树高（世界单位）
const TREE_R = 138;     // 树底半径
const GROUND_Y = -38;   // 地面高度（树干底部）

/* 4.1 树叶点云：圆锥体内采样，底部稍密 */
const foliage = [];
for (let i = 0; i < 900; i++) {
  const y = Math.pow(Math.random(), 0.85) * TREE_H;
  const rMax = TREE_R * (1 - (y / TREE_H) * 0.94);
  const r = rMax * (0.45 + 0.55 * Math.random()); // 偏向表面，显得蓬松
  const a = Math.random() * Math.PI * 2;
  foliage.push({
    x: Math.cos(a) * r, y, z: Math.sin(a) * r,
    size: rand(2.2, 5.2),
    color: `hsl(${rand(145, 165)},${rand(38, 55)}%,${rand(22, 42)}%)` // 柔和绿色系
  });
}

/* 4.2 螺旋灯带：沿圆锥面盘旋而上，持续闪烁 */
const lights = [];
const ROUNDS = 5.5; // 灯带缠绕圈数
for (let i = 0; i < 150; i++) {
  const t = i / 150;
  const y = 6 + t * (TREE_H - 14);
  const r = TREE_R * (1 - (y / TREE_H) * 0.94) + 4;
  const a = t * Math.PI * 2 * ROUNDS;
  lights.push({
    x: Math.cos(a) * r, y, z: Math.sin(a) * r,
    sprite: pickLightSprite(),
    size: rand(20, 30),
    phase: rand(0, Math.PI * 2), // 每盏灯闪烁相位不同
    speed: rand(1.8, 3.6)        // 闪烁频率不同，形成“亮闪闪”
  });
}

/* 4.3 装饰球：更大更亮，分两组明暗交替发光 */
const ornaments = [];
for (let i = 0; i < 26; i++) {
  const y = rand(20, TREE_H - 30);
  const r = TREE_R * (1 - (y / TREE_H) * 0.94) + 6;
  const a = Math.random() * Math.PI * 2;
  ornaments.push({
    x: Math.cos(a) * r, y, z: Math.sin(a) * r,
    sprite: lightSprites[i % lightSprites.length],
    size: rand(34, 46),
    phase: (i % 2) * Math.PI + rand(0, 0.8) // 奇偶两组相位相反 -> 明暗交替
  });
}

/* =====================================================================
 * 5. 背景星星与飘落雪花
 * =================================================================== */
const bgStars = Array.from({ length: 90 }, () => ({
  x: Math.random(), y: Math.random() * 0.75,
  r: rand(0.6, 1.8), phase: rand(0, Math.PI * 2), speed: rand(0.5, 1.6)
}));

const snows = Array.from({ length: 130 }, () => ({
  x: Math.random(), y: Math.random(),
  r: rand(1, 3.2),          // 半径（也决定下落层次感的透明度）
  v: rand(0.02, 0.07),      // 下落速度（屏幕高度/秒）
  drift: rand(0, Math.PI * 2),
  driftAmp: rand(10, 40)    // 左右摇摆幅度
}));

/* =====================================================================
 * 6. 卡通小动物与礼物盒（2D 卡通画法，锚定在 3D 世界中）
 * =================================================================== */

/* --- 萨摩耶小狗：白色蓬松、微笑吐舌、围着红围巾 --- */
function drawSamoyed(g, x, y, s) {
  g.save();
  g.translate(x, y);
  g.scale(s, s);
  const WHITE = '#fdfdff', SHADE = '#dfe8f4', PINK = 'rgba(255,150,170,.55)';

  // 卷起的蓬松尾巴（右侧）
  g.fillStyle = WHITE;
  [[42, -56, 26], [58, -80, 21], [50, -102, 14]].forEach(([cx, cy, r]) => {
    g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fill();
  });
  g.fillStyle = SHADE;
  g.beginPath(); g.arc(56, -80, 11, 0, Math.PI * 2); g.fill();

  // 蓬松身体
  fluff(g, 0, -64, 54, 46, WHITE, 12);

  // 两只前爪
  g.fillStyle = WHITE;
  roundRect(g, -26, -24, 20, 24, 9); g.fill();
  roundRect(g, 6, -24, 20, 24, 9); g.fill();
  g.strokeStyle = 'rgba(160,180,205,.6)'; g.lineWidth = 1.5;
  g.beginPath(); g.moveTo(-16, -12); g.lineTo(-16, -3); g.stroke();
  g.beginPath(); g.moveTo(16, -12); g.lineTo(16, -3); g.stroke();

  // 红围巾（绕脖子一圈 + 垂下来的一端）
  g.fillStyle = '#e85b6a';
  roundRect(g, -36, -106, 72, 18, 9); g.fill();
  g.save();
  g.translate(24, -92); g.rotate(0.18);
  roundRect(g, -8, 0, 18, 34, 8); g.fill();
  g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(-8, 10); g.lineTo(10, 10); g.stroke();
  g.beginPath(); g.moveTo(-8, 20); g.lineTo(10, 20); g.stroke();
  g.restore();

  // 圆圆的头 + 两颊绒毛
  g.fillStyle = WHITE;
  g.beginPath(); g.arc(-40, -132, 12, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.arc(40, -132, 12, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.arc(0, -136, 44, 0, Math.PI * 2); g.fill();

  // 三角耳朵 + 粉色内耳
  const ear = (cx, cy, r, tilt) => {
    g.save(); g.translate(cx, cy); g.rotate(tilt);
    g.fillStyle = WHITE;
    g.beginPath();
    g.moveTo(-r, r * 0.5);
    g.quadraticCurveTo(0, -r * 1.7, r, r * 0.5);
    g.closePath(); g.fill();
    g.fillStyle = PINK;
    g.beginPath();
    g.moveTo(-r * 0.5, r * 0.3);
    g.quadraticCurveTo(0, -r * 0.9, r * 0.5, r * 0.3);
    g.closePath(); g.fill();
    g.restore();
  };
  ear(-30, -166, 16, -0.18);
  ear(30, -166, 16, 0.18);

  // 黑色圆眼睛（带高光）
  g.fillStyle = '#33384a';
  g.beginPath(); g.arc(-16, -140, 5, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.arc(16, -140, 5, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#fff';
  g.beginPath(); g.arc(-17.5, -141.5, 1.6, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.arc(14.5, -141.5, 1.6, 0, Math.PI * 2); g.fill();

  // 腮红
  g.fillStyle = PINK;
  g.beginPath(); g.ellipse(-28, -126, 7, 4.5, 0, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.ellipse(28, -126, 7, 4.5, 0, 0, Math.PI * 2); g.fill();

  // 鼻子
  g.fillStyle = '#3a3f4a';
  g.beginPath(); g.ellipse(0, -122, 6, 4.5, 0, 0, Math.PI * 2); g.fill();

  // 吐舌微笑（萨摩耶招牌表情）
  g.strokeStyle = '#3a3f4a'; g.lineWidth = 2; g.lineCap = 'round';
  g.beginPath(); g.arc(-6, -118, 6, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke();
  g.beginPath(); g.arc(6, -118, 6, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke();
  g.fillStyle = '#ff9fb0';
  roundRect(g, -6, -117, 12, 16, 6); g.fill();
  g.strokeStyle = 'rgba(220,90,110,.7)'; g.lineWidth = 1.2;
  g.beginPath(); g.moveTo(0, -113); g.lineTo(0, -105); g.stroke();

  g.restore();
}

/* --- 软萌小猫：奶油色、闭眼微笑、戴着小圣诞帽 --- */
function drawKitten(g, x, y, s) {
  g.save();
  g.translate(x, y);
  g.scale(s, s);
  const CREAM = '#fbf1e2', SHADE = '#f0dfc6', STRIPE = '#e8d2b0', PINK = 'rgba(255,150,170,.55)';

  // 从左侧卷过来的尾巴
  g.fillStyle = CREAM;
  [[-34, -14, 12], [-50, -12, 10], [-62, -20, 9], [-66, -34, 8]].forEach(([cx, cy, r]) => {
    g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fill();
  });
  g.fillStyle = SHADE;
  g.beginPath(); g.arc(-66, -34, 5, 0, Math.PI * 2); g.fill(); // 尾巴尖

  // 坐姿身体
  g.fillStyle = CREAM;
  g.beginPath(); g.ellipse(0, -30, 36, 28, 0, 0, Math.PI * 2); g.fill();

  // 两只前腿
  roundRect(g, -16, -14, 13, 15, 6); g.fill();
  roundRect(g, 3, -14, 13, 15, 6); g.fill();

  // 大圆头
  g.beginPath(); g.arc(0, -74, 35, 0, Math.PI * 2); g.fill();

  // 三角耳朵 + 粉色内耳
  const ear = (cx, cy, r, tilt) => {
    g.save(); g.translate(cx, cy); g.rotate(tilt);
    g.fillStyle = CREAM;
    g.beginPath();
    g.moveTo(-r, r * 0.5);
    g.quadraticCurveTo(0, -r * 1.6, r, r * 0.5);
    g.closePath(); g.fill();
    g.fillStyle = PINK;
    g.beginPath();
    g.moveTo(-r * 0.5, r * 0.28);
    g.quadraticCurveTo(0, -r * 0.85, r * 0.5, r * 0.28);
    g.closePath(); g.fill();
    g.restore();
  };
  ear(-23, -100, 15, -0.15);
  ear(23, -100, 15, 0.15);

  // 额头三道软条纹
  g.strokeStyle = STRIPE; g.lineWidth = 3; g.lineCap = 'round';
  [-8, 0, 8].forEach(dx => {
    g.beginPath(); g.moveTo(dx, -104); g.lineTo(dx, -96); g.stroke();
  });

  // 闭眼的幸福微笑眼（⌒ ⌒）
  g.strokeStyle = '#5b5348'; g.lineWidth = 2.4;
  g.beginPath(); g.arc(-14, -73, 7, 1.12 * Math.PI, 1.88 * Math.PI); g.stroke();
  g.beginPath(); g.arc(14, -73, 7, 1.12 * Math.PI, 1.88 * Math.PI); g.stroke();

  // 小鼻子 + ω 嘴
  g.fillStyle = '#f2a0ae';
  g.beginPath();
  g.moveTo(-3, -64); g.lineTo(3, -64); g.lineTo(0, -60.5);
  g.closePath(); g.fill();
  g.strokeStyle = '#5b5348'; g.lineWidth = 1.8;
  g.beginPath(); g.arc(-3.5, -59.5, 3.5, 0.1 * Math.PI, 0.9 * Math.PI); g.stroke();
  g.beginPath(); g.arc(3.5, -59.5, 3.5, 0.1 * Math.PI, 0.9 * Math.PI); g.stroke();

  // 胡须
  g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = 1.4;
  [[-1, -68, -34, -72], [-1, -64, -34, -62], [1, -68, 34, -72], [1, -64, 34, -62]].forEach(([x1, y1, x2, y2]) => {
    g.beginPath(); g.moveTo(x1 * 12, y1); g.lineTo(x2, y2); g.stroke();
  });

  // 腮红
  g.fillStyle = PINK;
  g.beginPath(); g.ellipse(-22, -62, 6, 4, 0, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.ellipse(22, -62, 6, 4, 0, 0, Math.PI * 2); g.fill();

  // 小圣诞帽（歪戴在头顶）
  g.save();
  g.translate(6, -104); g.rotate(-0.32);
  g.fillStyle = '#e85b6a'; // 帽身
  g.beginPath();
  g.moveTo(-16, 0);
  g.quadraticCurveTo(-4, -34, 16, -30);
  g.quadraticCurveTo(6, -16, 14, 0);
  g.closePath(); g.fill();
  g.fillStyle = '#fff'; // 帽檐 + 绒球
  roundRect(g, -20, -6, 40, 13, 6); g.fill();
  g.beginPath(); g.arc(17, -31, 7, 0, Math.PI * 2); g.fill();
  g.restore();

  g.restore();
}

/* --- 小礼物盒 --- */
function drawGift(g, x, y, s, boxColor, ribbonColor) {
  g.save();
  g.translate(x, y);
  g.scale(s, s);
  const w = 52, h = 36;
  // 盒身
  g.fillStyle = boxColor;
  roundRect(g, -w / 2, -h, w, h, 6); g.fill();
  // 盒盖（稍宽，叠加深色阴影区分层次）
  g.fillStyle = 'rgba(0,0,0,.12)';
  roundRect(g, -w / 2 - 4, -h - 12, w + 8, 14, 6); g.fill();
  g.fillStyle = boxColor;
  roundRect(g, -w / 2 - 4, -h - 14, w + 8, 14, 6); g.fill();
  // 丝带
  g.fillStyle = ribbonColor;
  g.fillRect(-5, -h - 14, 10, h + 14);
  // 蝴蝶结
  g.beginPath(); g.ellipse(-8, -h - 18, 8, 5, -0.5, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.ellipse(8, -h - 18, 8, 5, 0.5, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.arc(0, -h - 16, 4, 0, Math.PI * 2); g.fill();
  g.restore();
}

/* 道具列表：两只小动物 + 两个礼物盒，锚定在树的周围 */
const props = [
  { x: TREE_R + 108, z: 62, scale: 1.0, shadow: 56, draw: drawSamoyed },
  { x: -(TREE_R + 92), z: -48, scale: 0.95, shadow: 40, draw: drawKitten },
  { x: TREE_R * 0.72, z: TREE_R * 0.95, scale: 0.9, shadow: 26, draw: (g, x, y, s) => drawGift(g, x, y, s, '#ff8fa8', '#fff0f4') },
  { x: -TREE_R * 0.55, z: TREE_R * 1.1, scale: 0.78, shadow: 24, draw: (g, x, y, s) => drawGift(g, x, y, s, '#8ecbff', '#f2faff') }
];

/* 绘制道具（含脚下柔影） */
function drawProp(p) {
  const s = p._p.s * (p.scale || 1);
  const x = p._p.x, y = p._p.y;
  ctx.fillStyle = 'rgba(8,10,26,.35)';
  ctx.beginPath();
  ctx.ellipse(x, y + 2 * s, p.shadow * s, p.shadow * 0.26 * s, 0, 0, Math.PI * 2);
  ctx.fill();
  p.draw(ctx, x, y, s);
}

/* =====================================================================
 * 7. 各部分的绘制函数
 * =================================================================== */

/* 雪地：树底一圈柔和的浅蓝白光晕 */
function drawSnowGround(gp) {
  const rx = TREE_R * 2.15 * gp.s, ry = rx * 0.26;
  ctx.save();
  ctx.translate(gp.x, gp.y);
  ctx.scale(1, ry / rx);
  const grd = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
  grd.addColorStop(0, 'rgba(214,228,255,.30)');
  grd.addColorStop(0.7, 'rgba(190,205,245,.12)');
  grd.addColorStop(1, 'rgba(190,205,245,0)');
  ctx.fillStyle = grd;
  ctx.beginPath(); ctx.arc(0, 0, rx, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

/* 树干（绕中心轴，旋转时基本不变形） */
function drawTrunk() {
  const t1 = project(0, 6, 0), t2 = project(0, GROUND_Y, 0);
  const w1 = 11 * t2.s, w2 = 16 * t2.s;
  ctx.fillStyle = '#6b4a35';
  ctx.beginPath();
  ctx.moveTo(t1.x - w1, t1.y);
  ctx.lineTo(t1.x + w1, t1.y);
  ctx.lineTo(t2.x + w2, t2.y);
  ctx.lineTo(t2.x - w2, t2.y);
  ctx.closePath();
  ctx.fill();
}

/* 圣诞树主体：所有点投影后按深度排序绘制（画家算法） */
function drawTree(t) {
  const pts = [];
  for (const p of foliage) pts.push({ k: 0, p, pr: project(p.x, p.y, p.z) });
  for (const p of lights) pts.push({ k: 1, p, pr: project(p.x, p.y, p.z) });
  for (const p of ornaments) pts.push({ k: 2, p, pr: project(p.x, p.y, p.z) });
  pts.sort((a, b) => b.pr.z - a.pr.z); // 远的先画，近的后画

  for (const it of pts) {
    const { p, pr } = it;
    if (it.k === 0) {
      // 树叶：柔和的绿色小圆点
      ctx.globalAlpha = 0.92;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(pr.x, pr.y, p.size * pr.s, 0, Math.PI * 2);
      ctx.fill();
    } else if (it.k === 1) {
      // 灯带：高频闪烁
      const tw = 0.5 + 0.5 * Math.sin(t * p.speed + p.phase);
      ctx.globalAlpha = 0.25 + 0.75 * tw;
      const sz = p.size * pr.s * (0.75 + 0.5 * tw);
      ctx.drawImage(p.sprite, pr.x - sz / 2, pr.y - sz / 2, sz, sz);
    } else {
      // 装饰球：慢速明暗交替（两组反相）
      const tw = 0.5 + 0.5 * Math.sin(t * 1.2 + p.phase);
      ctx.globalAlpha = 0.3 + 0.7 * tw;
      const sz = p.size * pr.s * (0.8 + 0.35 * tw);
      ctx.drawImage(p.sprite, pr.x - sz / 2, pr.y - sz / 2, sz, sz);
    }
  }
  ctx.globalAlpha = 1;
}

/* 树顶星星：呼吸般脉动的金色星光 */
function drawTopStar(t) {
  const pr = project(0, TREE_H + 16, 0);
  const pulse = 1 + 0.12 * Math.sin(t * 2.2);
  // 大范围光晕
  const gs = 110 * pr.s * pulse;
  ctx.globalAlpha = 0.9;
  ctx.drawImage(lightSprites[0], pr.x - gs / 2, pr.y - gs / 2, gs, gs);
  ctx.globalAlpha = 1;
  // 星形本体
  const r = 17 * pr.s * pulse;
  const grd = ctx.createLinearGradient(pr.x, pr.y - r, pr.x, pr.y + r);
  grd.addColorStop(0, '#fff7dd');
  grd.addColorStop(1, '#ffd166');
  ctx.fillStyle = grd;
  starPath(ctx, pr.x, pr.y, r);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.85)';
  ctx.lineWidth = 1.2;
  ctx.stroke();
}

/* =====================================================================
 * 8. 主渲染循环
 * =================================================================== */
let last = performance.now();

function frame(now) {
  const t = now / 1000;
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;

  // 无拖拽时缓慢自动旋转 + 拖拽惯性衰减
  if (!dragging) {
    rotY += 0.0016 + velY;
    velY *= 0.94;
  }

  /* --- 深色夜空背景 --- */
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#090d22');
  bg.addColorStop(0.55, '#131a3d');
  bg.addColorStop(1, '#0d1230');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  /* --- 右上角的一弯月亮 --- */
  const mx = W * 0.84, my = H * 0.15, mr = Math.min(W, H) * 0.045;
  const moonGlow = ctx.createRadialGradient(mx, my, 0, mx, my, mr * 3.4);
  moonGlow.addColorStop(0, 'rgba(240,240,255,.20)');
  moonGlow.addColorStop(1, 'rgba(240,240,255,0)');
  ctx.fillStyle = moonGlow;
  ctx.fillRect(mx - mr * 3.4, my - mr * 3.4, mr * 6.8, mr * 6.8);
  ctx.fillStyle = '#f4f6ff';
  ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#0d1330'; // 用背景色遮出月牙
  ctx.beginPath(); ctx.arc(mx + mr * 0.4, my - mr * 0.25, mr * 0.92, 0, Math.PI * 2); ctx.fill();

  /* --- 闪烁的背景星星 --- */
  ctx.fillStyle = '#ffffff';
  for (const st of bgStars) {
    ctx.globalAlpha = 0.25 + 0.6 * Math.abs(Math.sin(t * st.speed + st.phase));
    ctx.beginPath();
    ctx.arc(st.x * W, st.y * H, st.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  /* --- 树后暖色氛围光 --- */
  const c0 = project(0, TREE_H * 0.45, 0);
  const amb = ctx.createRadialGradient(c0.x, c0.y, 0, c0.x, c0.y, TREE_R * 2.3 * c0.s);
  amb.addColorStop(0, 'rgba(255,224,160,.10)');
  amb.addColorStop(1, 'rgba(255,224,160,0)');
  ctx.fillStyle = amb;
  ctx.fillRect(0, 0, W, H);

  /* --- 雪地 --- */
  drawSnowGround(project(0, GROUND_Y, 0));

  /* --- 道具按深度分两组：远处的先画（会被树遮挡），近处的后画 --- */
  for (const p of props) p._p = project(p.x, GROUND_Y, p.z);
  for (const p of props) if (p._p.z > 40) drawProp(p);

  /* --- 树干 + 树体 + 树顶星 --- */
  drawTrunk();
  drawTree(t);
  drawTopStar(t);

  for (const p of props) if (p._p.z <= 40) drawProp(p);

  /* --- 前景飘落雪花 --- */
  ctx.fillStyle = '#ffffff';
  for (const s of snows) {
    s.y += s.v * dt;
    if (s.y > 1.02) { s.y = -0.02; s.x = Math.random(); }
    const sx = s.x * W + Math.sin(t * 0.6 + s.drift) * s.driftAmp;
    ctx.globalAlpha = 0.25 + s.r * 0.2;
    ctx.beginPath();
    ctx.arc(sx, s.y * H, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
